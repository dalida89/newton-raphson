
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution of nonlinear equation Newton-Raphson Method</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJS Library for Derivative and Expression Evaluation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .btn-gradient-blue {
            background: linear-gradient(135deg, #0052cc 0%, #0066ff 100%);
        }
        .btn-gradient-yellow {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col justify-between p-4 sm:p-6 md:p-8">

    <!-- Main Container -->
    <div class="max-w-xl mx-auto w-full bg-white rounded-3xl shadow-xl border border-gray-100 p-6 sm:p-8 my-auto">
        
        <!-- Header Title matching design -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-blue-600 leading-tight">
                Solution of<br>nonlinear equation<br>Newton-Raphson<br>Method
            </h1>
        </div>

        <!-- Instruction Section -->
        <div class="mb-6 bg-blue-50/60 rounded-2xl p-4 border border-blue-100">
            <h2 class="text-xl font-bold text-gray-800 mb-1 flex items-center gap-2">
                Instruction!
            </h2>
            <p class="text-sm text-gray-600 leading-relaxed">
                To write "x" Power n, We use the symbol <code class="bg-blue-100 text-blue-800 font-semibold px-1.5 py-0.5 rounded">x^n</code>, not <code class="bg-red-100 text-red-700 font-semibold px-1.5 py-0.5 rounded">x`n</code>
            </p>
        </div>

        <!-- Input Form -->
        <div class="space-y-4 mb-6">
            <!-- Equation Input -->
            <div>
                <label for="equation" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 px-1">Equation f(x)</label>
                <div class="relative">
                    <input type="text" id="equation" placeholder="enter the equation (e.g. x^3 - x - 2)" 
                           value="x^3 - x - 2"
                           class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-800 placeholder-gray-400 font-medium">
                </div>
            </div>

            <!-- Initial Guess Input -->
            <div>
                <label for="initialGuess" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 px-1">Initial Guess (x0)</label>
                <div class="relative">
                    <input type="number" step="any" id="initialGuess" placeholder="enter the initial guess" 
                           value="1.5"
                           class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-800 placeholder-gray-400 font-medium">
                </div>
            </div>

            <!-- Max Iterations / Tolerance Settings (Expandable or Simple Inputs) -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="maxIter" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 px-1">Max Steps</label>
 <input type="number" id="maxIter" value="6" min="1" max="50" 
                           class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-center font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label for="tolerance" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 px-1">Tolerance</label>
                    <input type="number" id="tolerance" value="0.0001" step="0.0001" 
                           class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-center font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
        </div>

        <!-- Action Buttons matching design colors -->
        <div class="space-y-3 mb-6">
            <button onclick="calculateNewtonRaphson()" 
                    class="w-full py-4 text-white font-semibold rounded-xl btn-gradient-blue shadow-lg shadow-blue-500/20 hover:opacity-95 active:scale-[0.99] transition duration-150 flex items-center justify-center gap-2">
                <i class="fa-solid fa-calculator"></i>
                Calculate
            </button>

            <button onclick="checkInitialGuess()" 
                    class="w-full py-4 text-white font-semibold rounded-xl btn-gradient-yellow shadow-lg shadow-amber-500/20 hover:opacity-95 active:scale-[0.99] transition duration-150 flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-check"></i>
                Check the initial guess
            </button>
        </div>

        <!-- Status / Message Alert Box -->
        <div id="statusBox" class="hidden mb-6 p-4 rounded-xl border text-sm font-medium"></div>

        <!-- Derivative Info -->
        <div id="derivativeInfo" class="hidden mb-4 p-3 bg-slate-100 rounded-xl text-xs sm:text-sm text-slate-700 font-mono">
            <div><strong>f(x):</strong> <span id="dispFx"></span></div>
            <div><strong>f'(x):</strong> <span id="dispDfx"></span></div>
        </div>

        <!-- Results Table Design -->
        <div id="tableContainer" class="hidden overflow-hidden rounded-xl border border-gray-200 shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200 text-gray-700 text-xs sm:text-sm font-bold uppercase tracking-wider">
                            <th class="py-3 px-4 text-center">i</th>
                            <th class="py-3 px-4">x<sub>i</sub></th>
                            <th class="py-3 px-4">f(x<sub>i</sub>)</th>
                            <th class="py-3 px-4">f'(x<sub>i</sub>)</th>
                            <th class="py-3 px-4">|Error|</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTbody" class="divide-y divide-gray-200 text-xs sm:text-sm font-medium bg-white">
                        <!-- Dynamic Iteration Rows -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Floating Reset / Clear Button matching icon in screenshot -->
    <button onclick="resetFields()" title="Reset Form"
            class="fixed bottom-6 left-6 w-12 h-12 rounded-full bg-gray-900 text-white shadow-xl flex items-center justify-center hover:bg-gray-800 active:scale-95 transition">
        <i class="fa-solid fa-rotate-left text-lg"></i>
    </button>

    <!-- JavaScript Logic -->
    <script>
        /**
         * Cleans user input to replace curly power symbols or math syntax errors
         */
        function parseInputEquation(eqStr) {
            if (!eqStr) throw new Error("Please enter an equation!");
            // Replace backtick ^ with standard ^
            let cleaned = eqStr.replace(/`/g, '^');
            return cleaned;
        }
 
         * Calculates Newton-Raphson Iterations
         */
        function calculateNewtonRaphson() {
            const statusBox = document.getElementById('statusBox');
            const tbody = document.getElementById('resultsTbody');
            const tableContainer = document.getElementById('tableContainer');
            const derivativeInfo = document.getElementById('derivativeInfo');

            // Hide previous outputs
            statusBox.classList.add('hidden');
            tableContainer.classList.add('hidden');
            derivativeInfo.classList.add('hidden');
            tbody.innerHTML = '';

            try {
                const eqInput = document.getElementById('equation').value;
                const x0Input = document.getElementById('initialGuess').value;
                const maxSteps = parseInt(document.getElementById('maxIter').value) || 10;
                const tol = parseFloat(document.getElementById('tolerance').value) || 0.0001;

                if (x0Input === '' || isNaN(parseFloat(x0Input))) {
                    showStatus('Please enter a valid numeric initial guess (x0).', 'error');
                    return;
                }

                const cleanedEq = parseInputEquation(eqInput);

                // MathJS Parsing & Derivative Computation
                const node = math.parse(cleanedEq);
                const derivativeNode = math.derivative(node, 'x');

                const compiledF = node.compile();
                const compiledDf = derivativeNode.compile();

                // Display parsed formulas
                document.getElementById('dispFx').innerText = node.toString();
                document.getElementById('dispDfx').innerText = derivativeNode.toString();
                derivativeInfo.classList.remove('hidden');

                let currentX = parseFloat(x0Input);
                let rowsHtml = '';
                let converged = false;

                for (let i = 0; i <= maxSteps; i++) {
                    const fxVal = compiledF.evaluate({ x: currentX });
                    const dfxVal = compiledDf.evaluate({ x: currentX });

                    let nextX = 0;
                    let errorVal = 0;

                    if (Math.abs(dfxVal) < 1e-12) {
                        rowsHtml += 
                            <tr class="bg-red-50 text-red-700">
                                <td class="py-3 px-4 text-center font-bold">${i}</td>
                                <td class="py-3 px-4">${currentX.toFixed(6)}</td>
                                <td class="py-3 px-4">${fxVal.toFixed(6)}</td>
                                <td class="py-3 px-4">0 (Division by zero!)</td>
                                <td class="py-3 px-4">-</td>
                            </tr>;
                        showStatus('Stopped: Derivative f\'(x) is zero or extremely close to zero.', 'error');
                        break;
                    }

                    nextX = currentX - (fxVal / dfxVal);
                    errorVal = Math.abs(nextX - currentX);

                    rowsHtml += 
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="py-3 px-4 text-center font-bold text-blue-600">${i}</td>
                            <td class="py-3 px-4 font-semibold text-gray-900">${currentX.toFixed(6)}</td>
                            <td class="py-3 px-4">${fxVal.toFixed(6)}</td>
                            <td class="py-3 px-4">${dfxVal.toFixed(6)}</td>
                            <td class="py-3 px-4 font-mono text-xs text-gray-600">${i === 0 ? '-' : errorVal.toFixed(6)}</td>
                        </tr>;

                    // Check convergence
                    if (Math.abs(fxVal) < tol || errorVal < tol) {
                        converged = true;
                        showStatus(Converged successfully to root x ≈ <strong>${nextX.toFixed(6)}</strong> in ${i + 1} steps!, 'success');
                        currentX = nextX;
                        break;
                    }
 currentX = nextX;
                }

                tbody.innerHTML = rowsHtml;
                tableContainer.classList.remove('hidden');

                if (!converged) {
                    showStatus(Reached maximum steps limit (${maxSteps}). Approximate root is x ≈ <strong>${currentX.toFixed(6)}</strong>, 'warning');
                }

            } catch (err) {
                showStatus(Syntax Error: ${err.message}, 'error');
            }
        }

        /**
         * Checks the Convergence Condition: | f(x) * f''(x) / (f'(x))^2 | < 1 at x = x0
         */
        function checkInitialGuess() {
            const statusBox = document.getElementById('statusBox');
            try {
                const eqInput = document.getElementById('equation').value;
                const x0Input = document.getElementById('initialGuess').value;

                if (x0Input === '' || isNaN(parseFloat(x0Input))) {
                    showStatus('Please enter a valid numeric initial guess (x0) to test.', 'error');
                    return;
                }

                const cleanedEq = parseInputEquation(eqInput);
                const x0 = parseFloat(x0Input);

                // f(x), f'(x), f''(x)
                const fNode = math.parse(cleanedEq);
                const dfNode = math.derivative(fNode, 'x');
                const d2fNode = math.derivative(dfNode, 'x');

                const fx = fNode.compile().evaluate({ x: x0 });
                const dfx = dfNode.compile().evaluate({ x: x0 });
                const d2fx = d2fNode.compile().evaluate({ x: x0 });

                if (Math.abs(dfx) < 1e-12) {
                    showStatus(At x0 = ${x0}, f'(x0) is 0. The Newton-Raphson method will fail because of division by zero., 'error');
                    return;
                }

                // Condition: | f(x0) * f''(x0) / (f'(x0))^2 |
                const conditionVal = Math.abs((fx * d2fx) / Math.pow(dfx, 2));

                if (conditionVal < 1) {
                    showStatus(
                        <strong>Good Initial Guess!</strong><br>
                        Convergence Condition Value = <strong>${conditionVal.toFixed(4)}</strong> (< 1).<br>
                        The method is guaranteed to converge smoothly from x0 = ${x0}.
                    , 'success');
                } else {
                    showStatus(
                        <strong>Warning: Weak Initial Guess!</strong><br>
                        Convergence Condition Value = <strong>${conditionVal.toFixed(4)}</strong> (≥ 1).<br>
                        The method may converge slowly or diverge. Consider choosing a guess closer to the root.
                    , 'warning');
                }

            } catch (err) {
                showStatus(Evaluation Error: ${err.message}, 'error');
            }
        }

        /
          UI Helper: Shows message in alert box
         /
        function showStatus(msg, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.className = 'mb-6 p-4 rounded-xl border text-sm leading-relaxed';
            
            if (type === 'success') {
                statusBox.classList.add('bg-green-50', 'border-green-200', 'text-green-800');
            } else if (type === 'warning') {
                statusBox.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-800');
            } else {
                statusBox.classList.add('bg-red-50', 'border-red-200', 'text-red-800');
            }

            statusBox.innerHTML = msg;
            statusBox.classList.remove('hidden');
        }

        /
          Reset Fields Function
         /
        function resetFields() {
            document.getElementById('equation').value = '';
document.getElementById('initialGuess').value = '';
            document.getElementById('statusBox').classList.add('hidden');
            document.getElementById('tableContainer').classList.add('hidden');
            document.getElementById('derivativeInfo').classList.add('hidden');
            document.getElementById('resultsTbody').innerHTML = '';
        }
    </script>
</body>
</html>
